name: Automated MLOps Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Optional weekly automated trigger

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn scikit-learn numpy scipy joblib pytest

    - name: Step 1 - Check Data Drift
      id: drift-check
      run: |
        python drift_monitor.py

    - name: Step 2 - Retrain Model (Conditional)
      if: steps.drift-check.outputs.drift_detected == 'true'
      run: |
        echo "Data drift detected! Triggering automated retraining..."
        python retrain.py

    - name: Step 3 - Run Smoke & Integration Tests
      run: |
        echo "Starting FastAPI server for testing..."
        uvicorn app:app --host 127.0.0.1 --port 8000 &
        sleep 3
        
        echo "Running API health check..."
        curl -f http://127.0.0.1:8000/health
        
        echo "Running prediction endpoint test..."
        curl -X 'POST' \
          'http://127.0.0.1:8000/predict' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{"features": [5.1, 3.5, 1.4, 0.2]}'

    - name: Step 4 - Automated Deployment
      run: |
        echo "Model artifact verified and deployment successful!"