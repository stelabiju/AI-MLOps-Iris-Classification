name: Automated MLOps Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Step 1 - Check Data Drift
      id: drift-check
      run: |
        python drift_monitor.py

    - name: Step 2 - Retrain Model (Conditional)
      if: steps.drift-check.outputs.drift_detected == 'true'
      run: |
        echo "Data drift detected! Triggering automated retraining..."
        python retrain.py

    - name: Step 3 - Validate Model
      run: |
        python validate_model.py

    - name: Step 4 - Run Unit Tests
      run: |
        pytest

    - name: Step 5 - Run Smoke & Integration Tests
      run: |
        echo "Starting FastAPI server for testing..."
        uvicorn app:app --host 127.0.0.1 --port 8000 &
        sleep 3

        echo "Running API health check..."
        curl -f http://127.0.0.1:8000/health

        echo "Running prediction endpoint test..."
        curl -f -X POST \
          http://127.0.0.1:8000/predict \
          -H "accept: application/json" \
          -H "Content-Type: application/json" \
          -d '{"features":[5.1,3.5,1.4,0.2]}'

    - name: Step 6 - Automated Deployment
      run: |
        echo "Model validation passed."
        echo "Unit tests passed."
        echo "API smoke tests passed."
        echo "Deployment pipeline completed successfully."

    - name: Step 6 - Build Docker Image
      run: |
        docker build -t iris-mlops-api:latest .

    - name: Step 7 - Run Docker Container
      run: |
        docker run -d \
          --name iris-mlops-container \
          -p 8001:8000 \
          iris-mlops-api:latest

    - name: Step 8 - Test Docker Container
      run: |
        sleep 3

        echo "Testing container health..."
        curl -f http://127.0.0.1:8001/health

        echo "Testing container prediction..."
        curl -f -X POST \
          http://127.0.0.1:8001/predict \
          -H "Content-Type: application/json" \
          -d '{"features":[5.1,3.5,1.4,0.2]}'

    - name: Step 9 - Docker Logs
      if: always()
      run: |
        docker logs iris-mlops-container || true

    - name: Step 10 - Deployment Complete
      run: |
        echo "Docker image built successfully."
        echo "Docker container tested successfully."
        echo "MLOps pipeline completed successfully."

