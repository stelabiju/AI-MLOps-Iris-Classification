apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-mlops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-mlops-api
  template:
    metadata:
      labels:
        app: iris-mlops-api
    spec:
      containers:
        - name: iris-mlops-api
          image: stelabiju/iris-mlops-api:22e0df01c0afe7bd2c5ec7c81187e82acfaeb85c
          ports:
            - containerPort: 8000